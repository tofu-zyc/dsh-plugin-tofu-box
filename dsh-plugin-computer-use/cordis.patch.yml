# dsh-plugin-computer-use 自 wiring（dsh.bundle.patch 机制）：安装即注册，
# 无需手改 profile 的 cordis.patch.yml。
#
# 只有一行 host 半区：注入 tools/attachments 两个服务，基于 Cua Driver
# 进程内 SDK 注册 13 个 computer_* 工具，并在 tools/pre-execute 上挂审批 gate。
# 不再需要 shell/fs（v1 的 PowerShell 脚本路径已移除）。
# UI 归 dsh-plugin-read-image-preview 的通用图像卡（computer_* 键已在其
# TOOL_LABELS 中注册）；本包不带 client 半区。
#
# 行 config 全部可省略：
#   maxDim:     模型帧长边上限（默认 1568；窗口截图经驱动 set_config 缩放，
#               桌面截图由插件自行解码缩放）
#   settleMs:   动作序列步骤间的默认等待毫秒（默认 600）
#   askPolicy:  once-per-agent（默认，一次批准覆盖同 agent 后续动作）| always
#   telemetry:  是否允许 Cua Driver 遥测（默认 false，注入禁用环境变量）
- insert:
    - id: computer-use
      name: dsh-plugin-computer-use
      inject: [tools, attachments]
