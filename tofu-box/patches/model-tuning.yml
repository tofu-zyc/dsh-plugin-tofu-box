# dsh-plugin-model-tuning v3 self-wiring (dsh.bundle.patch mechanism).
#
# v3 keeps only the drawing capability: the `generate_image` /
# `list_image_models` tools plus the `imageGeneration` Remote service behind the
# settings page. The per-model compatibility switches on the official Models
# page and the drawing page need no extra rows.
#
# The v2 patch disabled the shipped `session-title-llm` row and inserted this
# bundle as a replacement title provider. That is gone: the shipped row already
# supports a provider/model route plus budgets in its Config, so title routing
# is configured again in the profile's cordis.patch.yml (and the official
# "标题随对话更新" optional bundle can be used normally).
- insert:
    - id: model-tuning
      name: dsh-plugin-model-tuning
